name: Google emulator image

# Publishes the official Datastore emulator (cloud-sdk + JRE, Dockerfile.google)
# to Docker Hub, so CI and the benchmark pull it instead of rebuilding it.

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.google
      - .github/workflows/google-emulator-image.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Read the cloud-sdk version from Dockerfile.google
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's|^FROM .*cloud-sdk:\([0-9.]*\).*|\1|p' Dockerfile.google | head -1)
          [[ -n "$VERSION" ]] || { echo "::error::cloud-sdk version not found in Dockerfile.google"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.google
          platforms: linux/amd64
          push: true
          tags: |
            guibeira/datastore-emulator-google:${{ steps.version.outputs.version }}
            guibeira/datastore-emulator-google:latest
