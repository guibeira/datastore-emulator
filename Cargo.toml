[package]
name = "datastore-emulator"
version = "0.1.8"
edition = "2024"
rust-version = "1.88"
license = "MIT"
readme = "README.md"
repository = "https://github.com/guibeira/datastore-emulator"
homepage = "https://github.com/guibeira/datastore-emulator"
description = "A Google Cloud Datastore emulator written in Rust."
keywords = ["datastore", "emulator", "google-cloud", "gcp"]
categories = ["command-line-utilities", "network-programming", "database"]
include = [
    "/benches/**",
    "/src/*.rs",
    "/src/bin/**",
    "/proto/**",
    "/build.rs",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
]

[lib]
name = "datastore_emulator"
path = "src/lib.rs"
doctest = false

# The benchmark load generator; not part of the default build or install:
#   cargo build --release --features loadgen --bin loadgen
[[bin]]
name = "loadgen"
path = "src/bin/loadgen.rs"
required-features = ["loadgen"]

[features]
loadgen = []

[dependencies]
tonic = { version = "0.12", features=["gzip"] }
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
uuid = { version = "1.3", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
byteorder = "1.5.0"
crc32c = "0.6.8"
rayon = "1.10"
tonic-health = "0.12"
axum = { version = "0.7", features = ["http2"] }
tower = { version = "0.5", features = ["util"] }
zip = "9.0.0"
bincode = { version = "2.0.1", features = ["serde"] }
base64 = "0.21"
gcloud-storage = "1.3.0"
clap = { version = "4.5.40", features = ["derive"] }
pbjson = "0.7"
pbjson-types = "0.7"
tower-http = { version = "0.6", features = ["cors"] }
mimalloc = "0.1"
parking_lot = "0.12"

[build-dependencies]
tonic-build = "0.12"
pbjson-build = "0.7"

[dev-dependencies]
once_cell = "1.21.3"
criterion = { version = "0.7", features = ["async_tokio", "html_reports"] }

[[bench]]
name = "query_baseline"
harness = false

# Whole-program optimization: measured 5-18% on commits, lookups and
# index-backed queries (benchmark/query_baseline_after_release_profile.md).
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
