<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, minimum-scale=1.0, initial-scale=1, user-scalable=yes" />
    <style>
      html {
        font-family: BlinkMacSystemFont,-apple-system,"Segoe UI",Roboto,Oxygen,Ubuntu,Cantarell,"Fira Sans","Droid Sans","Helvetica Neue",Helvetica,Arial,sans-serif;
        -webkit-font-smoothing: antialiased;
        background-color: #fff;
        font-size: 16px;
      }
      body {
        color: #4a4a4a;
        margin: 8px;
        font-size: 1em;
        font-weight: 400;
      }
      header {
        margin-bottom: 8px;
        display: flex;
        flex-direction: column;
      }
      main {
        width: 100%;
        display: flex;
        flex-direction: column;
      }
      a {
        color: #3273dc;
        cursor: pointer;
        text-decoration: none;
      }
      a:hover {
        color: #000;
      }
      button {
        color: #fff;
        background-color: #3298dc;
        border-color: transparent;
        cursor: pointer;
        text-align: center;
      }
      button:hover {
        background-color: #2793da;
        flex: none;
      }
      .spacer {
        flex: auto;
      }
      .small {
        font-size: 0.75rem;
      }
      footer {
        margin-top: 16px;
        display: flex;
        align-items: center;
      }
      .header-label {
        margin-right: 4px;
      }
      .benchmark-set {
        margin: 8px 0;
        width: 100%;
        display: flex;
        flex-direction: column;
      }
      .benchmark-title {
        font-size: 3rem;
        font-weight: 600;
        word-break: break-word;
        text-align: center;
      }
      .benchmark-graphs {
        display: flex;
        flex-direction: row;
        justify-content: space-around;
        align-items: center;
        flex-wrap: wrap;
        width: 100%;
      }
      .benchmark-chart {
        max-width: 1000px;
      }
    </style>
    <title>Benchmarks</title>
  </head>

  <body>
    <header id="header">
      <div class="header-item">
        <strong class="header-label">Last Update:</strong>
        <span id="last-update"></span>
      </div>
      <div class="header-item">
        <strong class="header-label">Repository:</strong>
        <a id="repository-link" rel="noopener"></a>
      </div>
    </header>
    <main id="main"></main>
    <footer>
      <button id="dl-button">Download data as JSON</button>
      <div class="spacer"></div>
      <div class="small">Powered by <a rel="noopener" href="https://github.com/marketplace/actions/continuous-benchmark">github-action-benchmark</a></div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@2.9.2/dist/Chart.min.js"></script>
    <script src="data.js"></script>
    <script id="main-script">
      'use strict';
      (function() {
        // Colors from https://github.com/github/linguist/blob/master/lib/linguist/languages.yml
        const toolColors = {
          cargo: '#dea584',
          go: '#00add8',
          benchmarkjs: '#f1e05a',
          benchmarkluau: '#000080',
          pytest: '#3572a5',
          googlecpp: '#f34b7d',
          catch2: '#f34b7d',
          julia: '#a270ba',
          jmh: '#b07219',
          benchmarkdotnet: '#178600',
          customBiggerIsBetter: '#38ff38',
          customSmallerIsBetter: '#ff3838',
          _: '#333333'
        };

        function init() {
          // Benches named "<test> (<series>) - <metric>" share one chart per
          // "<test> - <metric>", one line per series (Rust vs Java).
          const SERIES_PATTERN = /^(.*) \(([^()]+)\)( - .*)?$/;

          function collectBenchesPerTestCase(entries) {
            const map = new Map();
            for (const entry of entries) {
              const {commit, date, tool, benches} = entry;
              for (const bench of benches) {
                const m = SERIES_PATTERN.exec(bench.name);
                const chartName = m ? m[1] + (m[3] || '') : bench.name;
                const series = m ? m[2] : bench.name;
                const result = { commit, date, tool, bench, series };
                let chart = map.get(chartName);
                if (chart === undefined) {
                  chart = new Map();
                  map.set(chartName, chart);
                }
                const arr = chart.get(series);
                if (arr === undefined) {
                  chart.set(series, [result]);
                } else {
                  arr.push(result);
                }
              }
            }
            return map;
          }

          const data = window.BENCHMARK_DATA;

          // Render header
          document.getElementById('last-update').textContent = new Date(data.lastUpdate).toString();
          const repoLink = document.getElementById('repository-link');
          repoLink.href = data.repoUrl;
          repoLink.textContent = data.repoUrl;

          // Render footer
          document.getElementById('dl-button').onclick = () => {
            const dataUrl = 'data:,' + JSON.stringify(data, null, 2);
            const a = document.createElement('a');
            a.href = dataUrl;
            a.download = 'benchmark_data.json';
            a.click();
          };

          // Prepare data points for charts
          return Object.keys(data.entries).map(name => ({
            name,
            dataSet: collectBenchesPerTestCase(data.entries[name]),
          }));
        }

        function renderAllChars(dataSets) {

          const seriesColors = {
            Rust: '#dea584',
            Java: '#b07219',
          };
          const fallbackColors = ['#3273dc', '#23d160', '#ff3860', '#a270ba', '#00d1b2'];

          function renderGraph(parent, name, seriesMap) {
            const canvas = document.createElement('canvas');
            canvas.className = 'benchmark-chart';
            parent.appendChild(canvas);

            // Commits by commit date, so backfilled releases land in order;
            // a series missing a commit gets a gap.
            const commits = [];
            const commitIndex = new Map();
            for (const points of seriesMap.values()) {
              for (const point of points) {
                if (!commitIndex.has(point.commit.id)) {
                  commitIndex.set(point.commit.id, commits.length);
                  commits.push(point);
                }
              }
            }
            commits.sort((a, b) => Date.parse(a.commit.timestamp) - Date.parse(b.commit.timestamp));
            commits.forEach((point, i) => commitIndex.set(point.commit.id, i));

            let fallback = 0;
            const datasets = [];
            for (const [series, points] of seriesMap.entries()) {
              const color = seriesColors[series] || fallbackColors[fallback++ % fallbackColors.length];
              const values = new Array(commits.length).fill(null);
              const byIndex = new Array(commits.length).fill(null);
              for (const point of points) {
                const i = commitIndex.get(point.commit.id);
                values[i] = point.bench.value;
                byIndex[i] = point;
              }
              datasets.push({
                label: series,
                data: values,
                points: byIndex,
                borderColor: color,
                backgroundColor: color + '60', // Add alpha for #rrggbbaa
                fill: false,
                spanGaps: true,
              });
            }

            const unit = commits.length > 0 ? commits[0].bench.unit : '';
            const data = {
              labels: commits.map(d => d.commit.id.slice(0, 7)),
              datasets,
            };
            const options = {
              title: {
                display: true,
                text: name,
                fontSize: 16,
              },
              scales: {
                xAxes: [
                  {
                    scaleLabel: {
                      display: true,
                      labelString: 'commit',
                    },
                  }
                ],
                yAxes: [
                  {
                    scaleLabel: {
                      display: true,
                      labelString: unit,
                    },
                    ticks: {
                      beginAtZero: true,
                    }
                  }
                ],
              },
              tooltips: {
                mode: 'index',
                intersect: false,
                callbacks: {
                  afterTitle: items => {
                    const {index} = items[0];
                    const data = commits[index];
                    return '\n' + data.commit.message + '\n\n' + data.commit.timestamp + ' committed by @' + data.commit.committer.username + '\n';
                  },
                  label: item => {
                    const point = datasets[item.datasetIndex].points[item.index];
                    if (!point) {
                      return null;
                    }
                    let label = datasets[item.datasetIndex].label + ': ' + item.value + ' ' + point.bench.unit;
                    if (point.bench.range) {
                      label += ' (' + point.bench.range + ')';
                    }
                    return label;
                  },
                  afterLabel: item => {
                    const point = datasets[item.datasetIndex].points[item.index];
                    return point && point.bench.extra ? '  ' + point.bench.extra : '';
                  }
                }
              },
              onClick: (_mouseEvent, activeElems) => {
                if (activeElems.length === 0) {
                  return;
                }
                // XXX: Undocumented. How can we know the index?
                const index = activeElems[0]._index;
                const url = commits[index].commit.url;
                window.open(url, '_blank');
              },
            };

            new Chart(canvas, {
              type: 'line',
              data,
              options,
            });
          }

          function renderBenchSet(name, benchSet, main) {
            const setElem = document.createElement('div');
            setElem.className = 'benchmark-set';
            main.appendChild(setElem);

            const nameElem = document.createElement('h1');
            nameElem.className = 'benchmark-title';
            nameElem.textContent = name;
            setElem.appendChild(nameElem);

            const graphsElem = document.createElement('div');
            graphsElem.className = 'benchmark-graphs';
            setElem.appendChild(graphsElem);

            for (const [chartName, seriesMap] of benchSet.entries()) {
              renderGraph(graphsElem, chartName, seriesMap)
            }
          }

          const main = document.getElementById('main');
          for (const {name, dataSet} of dataSets) {
            renderBenchSet(name, dataSet, main);
          }
        }

        renderAllChars(init()); // Start
      })();
    </script>
  </body>
</html>
