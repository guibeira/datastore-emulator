services:
  datastore-emulator-rust:
    container_name: datastore_emulator_rust
    build:
      context: .
      dockerfile: Dockerfile
    command: [
      "--host-port", "0.0.0.0:8042",
      "--no-store-on-disk",
    ]
    ports:
      - "8042:8042"

  # The official Google Datastore emulator, published from Dockerfile.google
  # by .github/workflows/google-emulator-image.yml (amd64 only).
  datastore-emulator-google:
    container_name: datastore_emulator_google
    image: guibeira/datastore-emulator-google:541.0.0
    platform: linux/amd64
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx8G
    command: >
      /bin/sh -c "gcloud beta emulators datastore start 
      --project=test-project-2 
      --host-port=0.0.0.0:8044 
      --consistency=1.0
      --no-store-on-disk"
    ports:
      - "8044:8044" # gRPC port for the official Google emulator
